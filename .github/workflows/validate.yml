name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run validation checks
        run: |
          pnpm exec concurrently \
            --names format,lint,type-check,test,build \
            "pnpm format:check" \
            "pnpm lint" \
            "pnpm type-check" \
            "pnpm test" \
            "pnpm build"
      - name: Check skill files
        run: |
          changes="$(git status --porcelain --untracked-files=all -- \
            skills/architecture-companion)"
          if [ -n "$changes" ]; then
            printf '%s\n' 'The checked-in skill does not match the build result. Run `pnpm build` and commit the result.'
            printf '%s\n' "$changes"
            exit 1
          fi
